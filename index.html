<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <!-- إعدادات الصفحة -->
    <meta charset="UTF-8">

    <!-- جعل الموقع مناسب للموبايل -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- اسم الموقع -->
    <title>Nova Chat</title>

    <!-- ملف التصميم -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =================================
         التطبيق بالكامل
    ================================== -->

    <main class="app">


        <!-- =================================
             اللوجو واسم الموقع
        ================================== -->

        <header class="brand">

            <div class="logo">
                N
            </div>

            <h1>
                Nova Chat
            </h1>

            <p>
                تواصل مع أصدقائك بسهولة 💬
            </p>

        </header>


        <!-- =================================
             اختيار تسجيل الدخول / حساب جديد
        ================================== -->

        <nav class="auth-tabs">

            <button
                id="loginTab"
                class="tab active"
                type="button">

                تسجيل الدخول

            </button>


            <button
                id="registerTab"
                class="tab"
                type="button">

                حساب جديد

            </button>

        </nav>


        <!-- =================================
             صندوق تسجيل الدخول
        ================================== -->

        <section
            id="loginSection"
            class="auth-section">

            <h2>
                أهلاً بعودتك 👋
            </h2>


            <!-- رقم الهاتف -->

            <div class="input-group">

                <label for="loginPhone">
                    رقم الهاتف
                </label>

                <input
                    id="loginPhone"
                    type="tel"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="01xxxxxxxxx"
                    autocomplete="tel">

            </div>


            <!-- الرقم السري -->

            <div class="input-group">

                <label for="loginPin">
                    الرقم السري
                </label>

                <input
                    id="loginPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="6 أرقام"
                    autocomplete="current-password">

            </div>


            <!-- زر تسجيل الدخول -->

            <button
                id="loginButton"
                class="primary-button"
                type="button">

                تسجيل الدخول

            </button>

        </section>


        <!-- =================================
             صندوق إنشاء الحساب
        ================================== -->

        <section
            id="registerSection"
            class="auth-section hidden">

            <h2>
                إنشاء حساب جديد ✨
            </h2>


            <!-- رقم الهاتف -->

            <div class="input-group">

                <label for="registerPhone">
                    رقم الهاتف
                </label>

                <input
                    id="registerPhone"
                    type="tel"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="01xxxxxxxxx"
                    autocomplete="tel">

            </div>


            <!-- الرقم السري -->

            <div class="input-group">

                <label for="registerPin">
                    الرقم السري
                </label>

                <input
                    id="registerPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="6 أرقام"
                    autocomplete="new-password">

            </div>


            <!-- تأكيد الرقم السري -->

            <div class="input-group">

                <label for="registerPinConfirm">
                    تأكيد الرقم السري
                </label>

                <input
                    id="registerPinConfirm"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="أعد كتابة الرقم السري"
                    autocomplete="new-password">

            </div>


            <!-- زر إنشاء الحساب -->

            <button
                id="registerButton"
                class="primary-button"
                type="button">

                إنشاء الحساب

            </button>

        </section>


        <!-- =================================
             مكان رسائل الخطأ والنجاح
        ================================== -->

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite">
        </div>


        <!-- =================================
             حقوق الموقع
        ================================== -->

        <footer class="footer">

            <p>
                Nova Chat © 2026
            </p>

        </footer>


    </main>


    <!-- =================================
         JavaScript
         هنضيفه بعد ما نخلص التصميم
    ================================== -->

    <script
        type="module"
        src="app.js">
    </script>

</body>

</html>
