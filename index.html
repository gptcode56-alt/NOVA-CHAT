<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mيفا - تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #eaf9ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: white;
            padding: 35px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            border-radius: 24px;
            background: #55c7ed;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(85, 199, 237, 0.3);
        }

        .logo h1 {
            color: #27add8;
            margin-top: 12px;
            font-size: 32px;
        }

        .logo p {
            color: #888;
            margin-top: 6px;
        }

        .form {
            width: 100%;
        }

        .form h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            border: 1px solid #d8d8d8;
            border-radius: 13px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #55c7ed;
            box-shadow: 0 0 0 3px rgba(85, 199, 237, 0.12);
        }

        .main-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: #55c7ed;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .main-btn:active {
            transform: scale(0.98);
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .switch button {
            border: none;
            background: none;
            color: #20a9d5;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        @media (min-width: 600px) {
            .app {
                min-height: auto;
                border-radius: 25px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
                padding: 40px 35px;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- اللوجو -->
    <div class="logo">
        <div class="logo-icon">M</div>
        <h1>ميفا</h1>
        <p>تواصل مع أصدقائك بسهولة 💬</p>
    </div>


    <!-- تسجيل الدخول -->
    <div class="form" id="loginForm">

        <h2>تسجيل الدخول</h2>

        <div class="input-box">
            <label>رقم الهاتف</label>
            <input
                type="tel"
                id="loginPhone"
                placeholder="01xxxxxxxxx"
                maxlength="11">
        </div>

        <div class="input-box">
            <label>الرقم السري</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="6 أرقام"
                maxlength="6"
                inputmode="numeric">
        </div>

        <button class="main-btn" onclick="login()">
            تسجيل الدخول
        </button>

        <div class="error" id="loginError"></div>

        <div class="switch">
            ليس لديك حساب؟
            <button onclick="showRegister()">
                إنشاء حساب جديد
            </button>
        </div>

    </div>


    <!-- إنشاء حساب -->
    <div class="form hidden" id="registerForm">

        <h2>إنشاء حساب جديد</h2>

        <div class="input-box">
            <label>رقم الهاتف</label>
            <input
                type="tel"
                id="registerPhone"
                placeholder="01xxxxxxxxx"
                maxlength="11">
        </div>

        <div class="input-box">
            <label>الرقم السري</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="6 أرقام"
                maxlength="6"
                inputmode="numeric">
        </div>

        <div class="input-box">
            <label>تأكيد الرقم السري</label>
            <input
                type="password"
                id="registerPassword2"
                placeholder="أعد كتابة الرقم السري"
                maxlength="6"
                inputmode="numeric">
        </div>

        <button class="main-btn" onclick="register()">
            إنشاء الحساب
        </button>

        <div class="error" id="registerError"></div>

        <div class="switch">
            لديك حساب بالفعل؟
            <button onclick="showLogin()">
                تسجيل الدخول
            </button>
        </div>

    </div>

</div>


<script>

    // إظهار صفحة التسجيل
    function showRegister() {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.remove("hidden");
    }

    // إظهار صفحة تسجيل الدخول
    function showLogin() {
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
    }


    // إنشاء حساب
    function register() {

        const phone =
            document.getElementById("registerPhone").value.trim();

        const password =
            document.getElementById("registerPassword").value.trim();

        const password2 =
            document.getElementById("registerPassword2").value.trim();

        const error =
            document.getElementById("registerError");


        if (!/^01[0-9]{9}$/.test(phone)) {
            error.textContent =
                "اكتب رقم هاتف مصري صحيح.";
            return;
        }


        if (!/^[0-9]{6}$/.test(password)) {
            error.textContent =
                "الرقم السري يجب أن يكون 6 أرقام.";
            return;
        }


        if (password !== password2) {
            error.textContent =
                "الرقم السري غير متطابق.";
            return;
        }


        // تخزين مؤقت للتجربة فقط
        const user = {
            phone: phone,
            password: password
        };

        localStorage.setItem(
            "mifaUser",
            JSON.stringify(user)
        );


        error.style.color = "#20a96b";
        error.textContent =
            "تم إنشاء الحساب بنجاح!";


        setTimeout(() => {
            showLogin();
        }, 1000);
    }


    // تسجيل الدخول
    function login() {

        const phone =
            document.getElementById("loginPhone").value.trim();

        const password =
            document.getElementById("loginPassword").value.trim();

        const error =
            document.getElementById("loginError");


        const savedUser =
            localStorage.getItem("mifaUser");


        if (!savedUser) {
            error.textContent =
                "لا يوجد حساب، قم بإنشاء حساب جديد أولاً.";
            return;
        }


        const user =
            JSON.parse(savedUser);


        if (
            phone === user.phone &&
            password === user.password
        ) {

            error.style.color = "#20a96b";
            error.textContent =
                "تم تسجيل الدخول بنجاح!";

            // الخطوة القادمة:
            // الانتقال إلى الصفحة الرئيسية للشات

        } else {

            error.style.color = "#e74c3c";
            error.textContent =
                "رقم الهاتف أو الرقم السري غير صحيح.";
        }
    }

</script>

</body>
  </html>
