<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- الشعار -->
        <div class="logo-area">
            <div class="logo">N</div>

            <h1>Nova Chat</h1>

            <p>دردش مع أصدقائك بسهولة 💬</p>
        </div>


        <!-- التبويبات -->
        <div class="tabs">

            <button id="loginTab" class="tab active">
                تسجيل الدخول
            </button>

            <button id="registerTab" class="tab">
                حساب جديد
            </button>

        </div>


        <!-- =========================
             تسجيل الدخول
        ========================== -->

        <div id="loginForm">

            <div class="input-box">

                <label>رقم الهاتف</label>

                <input
                    id="loginPhone"
                    type="tel"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="01xxxxxxxxx">

            </div>


            <div class="input-box">

                <label>الرقم السري</label>

                <input
                    id="loginPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="••••••">

            </div>


            <button id="loginBtn" class="main-btn">
                تسجيل الدخول
            </button>

        </div>


        <!-- =========================
             إنشاء حساب
        ========================== -->

        <div id="registerForm" class="hidden">

            <div class="input-box">

                <label>رقم الهاتف</label>

                <input
                    id="registerPhone"
                    type="tel"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="01xxxxxxxxx">

            </div>


            <div class="input-box">

                <label>الرقم السري</label>

                <input
                    id="registerPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="6 أرقام">

            </div>


            <div class="input-box">

                <label>تأكيد الرقم السري</label>

                <input
                    id="registerPin2"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="أعد كتابة الرقم السري">

            </div>


            <button id="registerBtn" class="main-btn">
                إنشاء الحساب
            </button>

        </div>


        <!-- الرسائل -->

        <div id="message" class="message"></div>

    </div>


    <!-- JavaScript -->

    <script type="module" src="app.js"></script>

</body>

</html>
