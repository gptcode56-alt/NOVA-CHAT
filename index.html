<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- الشعار -->
        <section class="brand">
            <div class="logo">N</div>
            <h1>Nova Chat</h1>
            <p>تواصل مع أصدقائك بسهولة 💬</p>
        </section>


        <!-- تسجيل الدخول -->
        <section class="auth-card">

            <div class="tabs">
                <button id="loginTab" class="tab active">
                    تسجيل الدخول
                </button>

                <button id="registerTab" class="tab">
                    حساب جديد
                </button>
            </div>


            <!-- رقم الهاتف -->
            <div class="input-group">
                <label for="phone">رقم الهاتف</label>

                <input
                    id="phone"
                    type="tel"
                    inputmode="tel"
                    placeholder="+20 10xxxxxxxx"
                    autocomplete="tel">
            </div>


            <!-- زر إرسال الكود -->
            <button id="sendCodeBtn" class="main-btn">
                إرسال كود التحقق
            </button>


            <!-- منطقة OTP -->
            <div id="otpSection" class="otp-section hidden">

                <p class="otp-info">
                    أدخل كود التحقق الذي وصلك على هاتفك
                </p>

                <div class="input-group">
                    <label for="otp">كود التحقق</label>

                    <input
                        id="otp"
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="000000"
                        autocomplete="one-time-code">
                </div>

                <button id="verifyBtn" class="main-btn">
                    تأكيد الرقم
                </button>

                <button id="backBtn" class="secondary-btn">
                    تغيير رقم الهاتف
                </button>

            </div>


            <!-- رسائل الحالة -->
            <p id="message" class="message"></p>

        </section>

    </main>


    <!-- Firebase -->
    <script type="module" src="app.js"></script>

</body>
</html>
